name: Eval smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify offline DeepSeek agent package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/deepseek -p 'test_*.py' -v

      - name: Run deterministic smoke checks
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Explain current scope
        run: echo "This workflow verifies the frozen 20-task ceiling and the air-gapped model adapter policy; real model baselines remain an explicit release action."
